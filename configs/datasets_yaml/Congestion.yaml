dataset_name: Congestion
csv_path: Congestion/congestion.csv
num_features: 3
patch_size: 24
input_window: 96
horizon_window: 96
feature_names: ['traffic_volume', 'temp', 'clouds_all']
hyperparameters:
  lr: 0.0005
  d: 64
  lambda_rec: 1.0
  hidden_dim: 128
  hidden_layers: 2
  kl_weight: 0.05
  integrator:
    d_model: 64
    n_heads: 4
    d_ff: 128
    n_layers: 1
    dropout: 0.1
  tuned: false
  sweep_id: null