dataset_name: ETTh1-L
csv_path: ETT-small/ETTh1.csv
num_features: 7
patch_size: 24
input_window: 96
horizon_window: 96   # paper sweeps L in {96, 192, 336, 720}; this is the first setting
feature_names: [HUFL, HULL, MUFL, MULL, LUFL, LULL, OT]
hyperparameters:
  lr: 0.002
  d: 256
  lambda_rec: 0.5
  hidden_dim: 256  
  hidden_layers: 2
  kl_weight: 0.01 
  integrator:
    d_model: 128   
    n_heads: 4
    d_ff: 256      
    n_layers: 1    
    dropout: 0.1
  tuned: true
  sweep_id: 6mtimrqv