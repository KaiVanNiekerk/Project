dataset_name: Weather-L
csv_path: weather/weather.csv
num_features: 21
patch_size: 16
input_window: 96
horizon_window: 96   # paper sweeps L in {96, 192, 336, 720}; this is the first setting
feature_names:
  - "p (mbar)"
  - "T (degC)"
  - "Tpot (K)"
  - "Tdew (degC)"
  - "rh (%)"
  - "VPmax (mbar)"
  - "VPact (mbar)"
  - "VPdef (mbar)"
  - "sh (g/kg)"
  - "H2OC (mmol/mol)"
  - "rho (g/m**3)"
  - "wv (m/s)"
  - "max. wv (m/s)"
  - "wd (deg)"
  - "rain (mm)"
  - "raining (s)"
  - "SWDR (W/m2)"
  - "PAR (umol/m2/s)"
  - "max. PAR (umol/m2/s)"
  - "Tlog (degC)"
  - OT
hyperparameters: # NEED to decice on these
  lr: 1.0e-3
  d: 64
  lambda_rec: 1.0
  hidden_dim: 128
  #integrator:
  #  d_model: 64
  #  n_heads: 4
  #  d_ff: 256
  #  n_layers: 2
  #  dropout: 0.05
  tuned: false
  sweep_id: null